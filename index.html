<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For You</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
    background-size: 400% 400%;
    animation: gradientShift 12s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"><path fill="%23ff4d6d" d="M12 21s-6.7-4.35-9.3-8.28C1.02 10.36 1.4 7.4 3.6 5.6c2-1.64 4.82-1.3 6.4.5L12 8.2l2-2.1c1.58-1.8 4.4-2.14 6.4-.5 2.2 1.8 2.58 4.76.9 7.12C18.7 16.65 12 21 12 21z"/></svg>') 14 12, auto;
  }

  button {
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"><path fill="%23ff4d6d" d="M12 21s-6.7-4.35-9.3-8.28C1.02 10.36 1.4 7.4 3.6 5.6c2-1.64 4.82-1.3 6.4.5L12 8.2l2-2.1c1.58-1.8 4.4-2.14 6.4-.5 2.2 1.8 2.58 4.76.9 7.12C18.7 16.65 12 21 12 21z"/></svg>') 14 12, pointer;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* floating hearts */
  .heart {
    position: absolute;
    bottom: -50px;
    font-size: 24px;
    opacity: 0.7;
    animation: floatUp linear infinite;
    user-select: none;
    pointer-events: none;
  }

  @keyframes floatUp {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 0.8;
    }
    100% {
      transform: translateY(-110vh) rotate(360deg);
      opacity: 0;
    }
  }

  .card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 50px 40px;
    max-width: 420px;
    width: 90%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    z-index: 10;
    animation: popIn 0.6s ease;
  }

  @keyframes popIn {
    0% { transform: scale(0.8); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .question {
    font-size: 26px;
    color: #6b2c5f;
    margin-bottom: 35px;
    font-weight: 600;
    line-height: 1.4;
  }

  .buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
  }

  button {
    border: none;
    padding: 14px 34px;
    font-size: 17px;
    border-radius: 50px;
    cursor: pointer;
    font-weight: 600;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .yes-btn {
    background: linear-gradient(135deg, #ff6a88, #ff99ac);
    color: white;
    box-shadow: 0 8px 20px rgba(255, 106, 136, 0.4);
  }

  .no-btn {
    background: #f0f0f0;
    color: #555;
  }

  button:hover {
    transform: translateY(-3px) scale(1.05);
  }

  .yes-btn:hover {
    box-shadow: 0 12px 26px rgba(255, 106, 136, 0.55);
  }

  .subtext {
    margin-top: 18px;
    font-size: 14px;
    color: #a15a8f;
    opacity: 0.85;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="question" id="questionText">Do you have a moment for me? 💕</div>
    <div class="buttons" id="buttonsWrap">
      <button class="yes-btn" onclick="handleYes()">Yes</button>
      <button class="no-btn" onclick="handleNo()">No</button>
    </div>
    <div class="subtext" id="subtext"></div>
  </div>

<script>
  // Where "Yes" should take the user next.
  // Update this filename when you create your next page (e.g. "question2.html")
  const NEXT_PAGE = "question2.html";

  const questionText = document.getElementById("questionText");
  const buttonsWrap = document.getElementById("buttonsWrap");
  const subtext = document.getElementById("subtext");

  function handleYes() {
    // Take the user to the next question/page
    window.location.href = NEXT_PAGE;
  }

  function handleNo() {
    // Force them toward yes — only one option left
    questionText.textContent = "Are you sure? Please just say yes 🥺";
    buttonsWrap.innerHTML = '<button class="yes-btn" onclick="handleYes()">Yes</button>';
    subtext.textContent = "(there's only one right answer here)";
  }

  // Floating hearts background effect
  function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.textContent = ["💗", "💖", "💕", "❤️", "💓"][Math.floor(Math.random() * 5)];
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (16 + Math.random() * 20) + "px";
    heart.style.animationDuration = (6 + Math.random() * 6) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 12000);
  }
  setInterval(createHeart, 600);
</script>

</body>
</html>
