<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>For You</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(-45deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
    background-size: 400% 400%;
    animation: gradientShift 12s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
    transition: background 0.8s ease;
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"><path fill="%23ff4d6d" d="M12 21s-6.7-4.35-9.3-8.28C1.02 10.36 1.4 7.4 3.6 5.6c2-1.64 4.82-1.3 6.4.5L12 8.2l2-2.1c1.58-1.8 4.4-2.14 6.4-.5 2.2 1.8 2.58 4.76.9 7.12C18.7 16.65 12 21 12 21z"/></svg>') 14 12, auto;
  }

  button {
    cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"><path fill="%23ff4d6d" d="M12 21s-6.7-4.35-9.3-8.28C1.02 10.36 1.4 7.4 3.6 5.6c2-1.64 4.82-1.3 6.4.5L12 8.2l2-2.1c1.58-1.8 4.4-2.14 6.4-.5 2.2 1.8 2.58 4.76.9 7.12C18.7 16.65 12 21 12 21z"/></svg>') 14 12, pointer;
  }

  body.sad-bg {
    background: linear-gradient(-45deg, #6a85b6, #bac8e0, #8697c4, #a8bfe0);
    background-size: 400% 400%;
    animation: gradientShift 12s ease infinite;
  }

  body.final-bg {
    background: linear-gradient(-45deg, #ff7e5f, #feb47b, #ff6a88, #6a3093);
    background-size: 400% 400%;
    animation: gradientShift 14s ease infinite;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .heart {
    position: absolute;
    bottom: -50px;
    font-size: 24px;
    opacity: 0.7;
    animation: floatUp linear infinite;
    user-select: none;
    pointer-events: none;
    z-index: 1;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 0.8; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  .tear {
    position: absolute;
    top: -50px;
    font-size: 22px;
    opacity: 0.8;
    animation: fallDown linear infinite;
    user-select: none;
    pointer-events: none;
    z-index: 1;
  }

  @keyframes fallDown {
    0% { transform: translateY(0); opacity: 0.9; }
    100% { transform: translateY(110vh); opacity: 0; }
  }

  .firefly {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #fff6b0;
    border-radius: 50%;
    box-shadow: 0 0 8px 3px rgba(255, 246, 176, 0.8), 0 0 16px 6px rgba(255, 210, 120, 0.4);
    opacity: 0.7;
    animation: fireflyDrift ease-in-out infinite;
    pointer-events: none;
    z-index: 1;
  }

  @keyframes fireflyDrift {
    0%   { transform: translate(0, 0); opacity: 0.3; }
    25%  { transform: translate(15px, -20px); opacity: 1; }
    50%  { transform: translate(-10px, -35px); opacity: 0.5; }
    75%  { transform: translate(20px, -15px); opacity: 1; }
    100% { transform: translate(0, 0); opacity: 0.3; }
  }

  .card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 50px 40px;
    max-width: 440px;
    width: 90%;
    min-height: 260px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    z-index: 10;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    animation: popIn 0.5s ease;
  }

  @keyframes popIn {
    0% { transform: scale(0.85); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .screen { display: none; width: 100%; flex-direction: column; align-items: center; }
  .screen.active { display: flex; }

  .question {
    font-size: 25px;
    color: #6b2c5f;
    margin-bottom: 32px;
    font-weight: 600;
    line-height: 1.4;
  }

  .buttons {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
    position: relative;
    width: 100%;
    min-height: 60px;
  }

  button {
    border: none;
    padding: 14px 34px;
    font-size: 17px;
    border-radius: 50px;
    font-weight: 600;
    transition: transform 0.15s ease, box-shadow 0.2s ease, left 0.25s ease, top 0.25s ease;
  }

  .yes-btn {
    background: linear-gradient(135deg, #ff6a88, #ff99ac);
    color: white;
    box-shadow: 0 8px 20px rgba(255, 106, 136, 0.4);
  }

  .no-btn { background: #f0f0f0; color: #555; }
  button:hover { transform: translateY(-3px) scale(1.05); }
  .yes-btn:hover { box-shadow: 0 12px 26px rgba(255, 106, 136, 0.55); }

  #runawayWrap { position: relative; width: 100%; height: 160px; }
  #runawayNo { position: absolute; }
  #runawayYes { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }

  .subtext {
    margin-top: 16px;
    font-size: 14px;
    color: #a15a8f;
    opacity: 0.85;
  }

  .final-card { background: rgba(255, 255, 255, 0.08); box-shadow: none; }

  .burst-heart {
    font-size: 60px;
    animation: burst 1.2s ease forwards;
  }

  @keyframes burst {
    0% { transform: scale(0.3); opacity: 0; }
    50% { transform: scale(1.3); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  .lets-go {
    margin-top: 20px;
    font-size: 32px;
    font-weight: 700;
    color: #fff;
    opacity: 0;
    animation: fadeInUp 1s ease forwards;
    animation-delay: 0.8s;
    text-shadow: 0 4px 24px rgba(255, 200, 100, 0.85);
  }

  @keyframes fadeInUp {
    0% { opacity: 0; transform: translateY(15px); }
    100% { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body id="bodyEl">

  <div class="card" id="cardEl">

    <div class="screen active" id="screenLoveOk">
      <div class="question">I love you. Are you okay with that? 💗</div>
      <div class="buttons">
        <button class="yes-btn" onclick="goTo('screenDoYouLoveMe')">Yes</button>
        <button class="no-btn" onclick="goTo('screenDidIDoBad')">No</button>
      </div>
    </div>

    <div class="screen" id="screenDidIDoBad">
      <div class="question">Did I do something bad? 🥺</div>
      <div class="buttons">
        <button class="yes-btn" onclick="goTo('screenSorry')">Yes</button>
        <button class="no-btn" onclick="goTo('screenLoveOk')">No</button>
      </div>
    </div>

    <div class="screen" id="screenSorry">
      <div class="question">I'm sorry 😢</div>
      <div class="buttons">
        <button class="yes-btn" onclick="goTo('screenLoveOk')">Yes</button>
      </div>
      <div class="subtext">Let's start over, okay?</div>
    </div>

    <div class="screen" id="screenDoYouLoveMe">
      <div class="question">Do you love me? 💓</div>
      <div id="runawayWrap">
        <button class="yes-btn" id="runawayYes" onclick="handleFinalYes()">Yes</button>
        <button class="no-btn" id="runawayNo">No</button>
      </div>
    </div>

    <div class="screen" id="screenFinal">
      <div class="burst-heart">💖</div>
      <div class="lets-go">Let's go 🥰</div>
      <button class="yes-btn" id="continueBtn" onclick="goToNext()" style="margin-top: 26px; opacity: 0; animation: fadeInUp 1s ease forwards; animation-delay: 2s;">Continue</button>
    </div>

  </div>

<script>
  const bodyEl = document.getElementById("bodyEl");
  const cardEl = document.getElementById("cardEl");
  let tearInterval = null;

  function goTo(screenId) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(screenId).classList.add("active");
    bodyEl.classList.remove("sad-bg", "final-bg");
    stopTears();
    if (screenId === "screenSorry") {
      bodyEl.classList.add("sad-bg");
      startTears();
    }
  }

  function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.textContent = ["💗", "💖", "💕", "❤️", "💓"][Math.floor(Math.random() * 5)];
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (16 + Math.random() * 20) + "px";
    heart.style.animationDuration = (6 + Math.random() * 6) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 13000);
  }
  setInterval(createHeart, 700);

  function createTear() {
    const tear = document.createElement("div");
    tear.classList.add("tear");
    tear.textContent = "💧";
    tear.style.left = Math.random() * 100 + "vw";
    tear.style.fontSize = (14 + Math.random() * 16) + "px";
    tear.style.animationDuration = (3 + Math.random() * 3) + "s";
    document.body.appendChild(tear);
    setTimeout(() => tear.remove(), 6500);
  }
  function startTears() {
    if (tearInterval) return;
    tearInterval = setInterval(createTear, 300);
  }
  function stopTears() {
    if (tearInterval) { clearInterval(tearInterval); tearInterval = null; }
  }

  const runawayWrap = document.getElementById("runawayWrap");
  const runawayNo = document.getElementById("runawayNo");

  function placeNoRandomly() {
    const wrapRect = runawayWrap.getBoundingClientRect();
    const btnW = runawayNo.offsetWidth || 100;
    const btnH = runawayNo.offsetHeight || 50;
    const maxX = Math.max(wrapRect.width - btnW, 0);
    const maxY = Math.max(wrapRect.height - btnH, 0);
    runawayNo.style.left = (Math.random() * maxX) + "px";
    runawayNo.style.top = (Math.random() * maxY) + "px";
  }

  runawayNo.style.left = "10px";
  runawayNo.style.top = "0px";

  document.addEventListener("mousemove", (e) => {
    const activeScreen = document.getElementById("screenDoYouLoveMe");
    if (!activeScreen.classList.contains("active")) return;
    const rect = runawayNo.getBoundingClientRect();
    const dist = Math.hypot(e.clientX - (rect.left + rect.width / 2), e.clientY - (rect.top + rect.height / 2));
    if (dist < 90) placeNoRandomly();
  });

  document.addEventListener("touchmove", (e) => {
    const activeScreen = document.getElementById("screenDoYouLoveMe");
    if (!activeScreen.classList.contains("active")) return;
    const touch = e.touches[0];
    if (!touch) return;
    const rect = runawayNo.getBoundingClientRect();
    const dist = Math.hypot(touch.clientX - (rect.left + rect.width / 2), touch.clientY - (rect.top + rect.height / 2));
    if (dist < 100) placeNoRandomly();
  }, { passive: true });

  function handleFinalYes() {
    goTo('screenFinal');
    bodyEl.classList.add('final-bg');
    cardEl.classList.add('final-card');
    spawnFireflies();
    spawnHeartBurst();
  }

  function goToNext() {
    window.location.href = "question3.html";
  }

  function spawnFireflies() {
    for (let i = 0; i < 35; i++) {
      const firefly = document.createElement("div");
      firefly.classList.add("firefly");
      firefly.style.left = Math.random() * 100 + "vw";
      firefly.style.top = Math.random() * 100 + "vh";
      firefly.style.animationDuration = (4 + Math.random() * 4) + "s";
      firefly.style.animationDelay = (Math.random() * 3) + "s";
      document.body.appendChild(firefly);
    }
  }

  function spawnHeartBurst() {
    const emojis = ["💖", "💕", "💓", "💗", "❤️", "✨"];
    for (let i = 0; i < 25; i++) {
      setTimeout(() => {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (18 + Math.random() * 26) + "px";
        heart.style.animationDuration = (5 + Math.random() * 5) + "s";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 11000);
      }, i * 120);
    }
  }
</script>

</body>
</html>
